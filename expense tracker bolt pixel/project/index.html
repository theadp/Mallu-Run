<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <meta property="og:image" content="https://bolt.new/static/og_default.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png">
</head>
  <body>
    <header class="header">
      <div class="header-inner">
        <div class="header-brand">
          <h1 class="brand-name">Expense Tracker</h1>
        </div>
        <button
          type="button"
          class="theme-toggle"
          id="themeToggle"
          aria-label="Toggle light or dark theme"
          aria-pressed="false"
        >
          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" />
          </svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
          <span class="theme-toggle-label sr-only">Dark</span>
        </button>
      </div>
    </header>

    <main class="main">
      <section class="overview" aria-label="Spending overview">
        <p class="overview-greeting" id="greeting">Good evening</p>
        <p class="overview-amount" id="monthSpent">₹0.00</p>
        <p class="overview-label">Spent this month</p>
        <p class="overview-meta" id="overviewMeta">0 expenses · August 2026</p>
      </section>

      <section class="stats" aria-label="Spending statistics">
        <div class="stat">
          <span class="stat-label">Total spent</span>
          <span class="stat-value" id="totalSpent">₹0.00</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat">
          <span class="stat-label">Expenses</span>
          <span class="stat-value" id="expenseCount">0</span>
        </div>
        <div class="stat-divider" aria-hidden="true"></div>
        <div class="stat">
          <span class="stat-label">Top category</span>
          <span class="stat-value" id="topCategory">—</span>
        </div>
      </section>

      <section class="panel" aria-label="Add a new expense">
        <h2 class="panel-title">Add expense</h2>
        <form id="expenseForm" class="expense-form" novalidate>
          <div class="form-row">
            <div class="field field-grow">
              <label for="description">Description</label>
              <input
                type="text"
                id="description"
                name="description"
                placeholder="e.g. Lunch at café"
                autocomplete="off"
              />
            </div>
            <div class="field field-amount">
              <label for="amount">Amount</label>
              <div class="amount-input">
                <span class="currency-prefix" aria-hidden="true">₹</span>
                <input
                  type="number"
                  id="amount"
                  name="amount"
                  inputmode="decimal"
                  step="0.01"
                  min="0.01"
                  placeholder="0.00"
                  autocomplete="off"
                />
              </div>
            </div>
          </div>
          <div class="form-row">
            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option value="" disabled selected>Select…</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input type="date" id="date" name="date" />
            </div>
            <div class="field field-actions">
              <button type="submit" class="btn-primary">Add expense</button>
            </div>
          </div>
          <div class="form-error" id="formError" role="alert" hidden></div>
        </form>
      </section>

      <section class="panel" aria-label="Expense list and filters">
        <div class="list-header">
          <h2 class="panel-title">Recent expenses</h2>
          <div class="filters">
            <div class="field field-sm">
              <label for="search" class="sr-only">Search by description</label>
              <div class="search-wrap">
                <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <circle cx="11" cy="11" r="8" />
                  <path d="m21 21-4.35-4.35" />
                </svg>
                <input
                  type="search"
                  id="search"
                  name="search"
                  placeholder="Search…"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="field field-sm">
              <label for="filterCategory" class="sr-only">Filter by category</label>
              <select id="filterCategory" name="filterCategory">
                <option value="">All categories</option>
                <option value="Food">Food</option>
                <option value="Transport">Transport</option>
                <option value="Shopping">Shopping</option>
                <option value="Bills">Bills</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Health">Health</option>
                <option value="Other">Other</option>
              </select>
            </div>
            <div class="field field-sm">
              <label for="filterMonth" class="sr-only">Filter by month</label>
              <select id="filterMonth" name="filterMonth">
                <option value="">All months</option>
              </select>
            </div>
            <button type="button" class="btn-ghost" id="clearFilters">Clear</button>
          </div>
        </div>

        <div class="table-wrap">
          <table class="expense-table">
            <thead>
              <tr>
                <th scope="col">Category</th>
                <th scope="col">Description</th>
                <th scope="col" class="col-date">Date</th>
                <th scope="col" class="col-amount">Amount</th>
                <th scope="col" class="col-action"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="expenseBody"></tbody>
          </table>
          <div class="empty-state" id="emptyState" hidden>
            <p class="empty-title">No expenses yet</p>
            <p class="empty-hint">Your spending history will appear here.</p>
            <button type="button" class="btn-ghost" id="emptyAddBtn">Add your first expense</button>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
